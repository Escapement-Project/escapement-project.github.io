# The Escapement Project's design tokens: one source for the web pages and verge-gui.
# `uv run design/build.py` writes static/tokens.css, the web fonts, design/out/tokens.rs and the
# fonts verge-gui embeds. Colours are by role, each with a day and a night value; a role keeps its
# meaning on every surface. Decisions and their reasons: design/README.md.

# Core neutrals. Text roles keep 4.5:1 on page, surface, raised and sunken in both faces (day ink-2
# was #56636e, 4.27:1 on sunken). Rule outlines controls, so it keeps 3:1 against page, surface and
# raised (night was #353b46, 1.54:1 against the surface; day #7b8e99, 2.72:1 against the page).
[color.page]
day = "#dce8ed"
night = "#0e1216"
[color.surface]
day = "#eef4f6"
night = "#151b21"
[color.raised]
day = "#ffffff"
night = "#1b232b"
[color.sunken]
day = "#cbd9e0"
night = "#0a0d10"
[color.hair]
day = "#bccbd3"
night = "#29333c"
[color.rule]
day = "#738691"
night = "#636e79"
[color.ink]
day = "#11171d"
night = "#e6ebee"
[color.ink-2]
day = "#525f6a"
night = "#aab5be"

# Identity. Lume is a fill only, never a line or text, with on-lume on it. The plate carries the
# marks and the app icon in both faces.
[color.lume]
day = "#c4f03c"
night = "#c4f03c"
[color.on-lume]
day = "#11171d"
night = "#11171d"
[color.plate]
day = "#11171d"
night = "#11171d"
# Lines drawn on the plate, such as the mark's stems, trace and beam, drawn at partial opacity. The
# plate is the same in both faces, so they are too.
[color.plate-line]
day = "#aab5be"
night = "#aab5be"

# The landing page's hero dial alone: its hand, ring and face. The window's edge outlines a window
# of lume by day: the dial's, and the measurements page's headline.
[color.hand]
day = "#c8102e"
night = "#ef3b4a"
[color.ring]
day = "#eef4f6"
night = "#1b232b"
[color.face]
day = "#dce8ed"
night = "#11171d"
[color.window-edge]
day = "#11171d"
night = "transparent"

# Status, always with an icon or words: ink for text and lines, fill for areas, on-status for
# text on a fill (4.9:1 on the fault fill). The inks keep 4.5:1 on every ground: by day, attention
# moved toward amber as it darkened (#b45309 was 4.02:1 on the page), away from the fault red.
[color.fault-ink]
day = "#b81c20"
night = "#f24e4d"
[color.fault-fill]
day = "#ef4b4b"
night = "#ef4b4b"
[color.attention-ink]
day = "#924a03"
night = "#f1710d"
[color.attention-fill]
day = "#f1710d"
night = "#f1710d"
[color.on-status]
day = "#11171d"
night = "#11171d"

# Data: a colour follows the probe it measures, never its rank. Verge and NXP's firmware were
# validated all-pairs against both faces' surfaces and the status colours; no third hue passed, so
# reference probes take the context colour and a pattern of their own. The day context is a step
# darker than ink-2: at ink-2 it sat 12.7 from Verge's teal in normal vision, under the floor of 15.
[color.series-verge]
day = "#0f8a6c"
night = "#1aa384"
[color.series-nxp]
day = "#2a78d6"
night = "#3987e5"
[color.series-context]
day = "#47525c"
night = "#aab5be"

# Interaction is hue-free: a 2 px ink focus ring, an ink wash at 12 % for what the pointer is on,
# an ink fill with page text for what is selected.
[interaction]
focus-width = 2
wash = 0.12

# Line patterns, as stroke dash arrays at a 2 px line. A probe's headline build (Clang) is solid
# and its other build (GCC) dashed; a figure measured where the firmware reads wrong is dotted, its
# points hollow; a reference probe dash-dotted; a run under energy capture thinner and at 60 %, and a
# second capture run of the same build long-dashed.
[pattern]
second-build = [6, 3]
misread = [2, 4]
reference = [8, 3, 2, 3]
capture-second = [12, 4]
capture-opacity = 0.6
capture-width = 1.5

# Verge's mark in motion, in tickwave's grammar of a capture taken again: the V dims to grey as a
# floor and stems grow under it; a beam sweeps the plate, and as it reaches each sample the grey one
# fades and a new one rises in lume from the floor to its place on the project's step, the riser's
# stem in lume (the step's edge, as tickwave's ruler and the project's mark show one); a hold; the
# step dims and the next sweep takes the V again the same way. Its shape is the mark's own
# (design/marks/verge.svg, and verge-24.svg where it is drawn at 24 px); this section is everything
# else. The landing page and verge-gui both draw it from what the build generates (design/README.md,
# "The mark in motion"). Places are on the 64-unit grid, times in seconds.
[motion.mark]
sweep = 0.28                    # the beam crossing the plate, each way
move = 0.18                     # one sample's rise, once the beam reaches it
hold = 0.6                      # on the step, from the last sample landing to the second sweep
grow = 0.1                      # the samples dimming before each sweep; the floor and stems growing at the start, retracting at the end
rest = 1.4                      # on the V between plays, where it loops (verge-gui, waiting)
ease = 3                        # a rise eases out at this power: out-cubic, which never overshoots
step = [0, 0, 0, 0.5, 1, 1, 1]  # each sample's level on the step, from the floor (0) to the top (1)
riser = 32                      # the step's riser
floor = [4, 60]                 # the floor's run
beam = [2, 62]                  # the beam's run, top to bottom
stem = 1.6                      # line widths: the stems,
line = 1.1                      # the floor and the step's trace,
beam-width = 1.2                # and the beam
line-opacity = 0.45             # the stems, floor, trace and dimmed samples in plate-line at this opacity,
beam-opacity = 0.6              # the beam at this; the trace, floor and stems under the samples, the beam over
fitted-line = 1.0               # every line's width at 24 px, on the fitted master, in pixels

# tickwave's mark in motion: the time axis zooms in on one rising edge until it is the only edge in
# view, the project's step, holds there and zooms back out. Its times are Verge's, so both marks
# reach the step, hold and return together: still while Verge's samples dim (motion.mark's grow),
# in over its sweep and move, held for its hold, out as long as in, eased in and out at its power.
# The wave and ruler come from marks/tickwave.svg.
[motion.tickwave-mark]
edge = 38                       # the rising edge it zooms to, which glides to the middle
scale = 3                       # how far it zooms: far enough that every other edge leaves the wave's run
thirds = [1.6, 2.4]             # the zoom over which a tick at each third fades in, so the ruler stays as dense as at rest

# The project's mark in motion (marks/dial.svg): its edge as a signal through the ring. Lock, as the
# landing's hero arrives: a chirp passes through the ring at one speed, its pulses widening, and
# slows to rest as one rising edge reaches the centre, which is the mark. Again, on the header's logo
# on hover or tap: from the mark the signal moves on through a new chirp and locks again, gathering
# speed as Lock sheds it. tickwave's ruler runs under the signal while it moves, in [icon.tickwave]'s
# colours, and fades once it stops. Below a pixel's worth the pulses and ticks keep their floors, so a
# 24 px logo still reads. Lengths in the mark's 64 units, speeds in units a second, times in seconds;
# the build writes them into tokens.css as --project-mark-*, which header.js reads.
[motion.project-mark]
speed = 180                     # Lock's speed
again = 240                     # Again's speed
ramp = 20                       # the units each slows over to rest, and Again gathers speed over
densest = 7                     # the chirp's densest half-period,
dense = 6                       # how many of it open the chirp,
growth = 1.12                   # each half-period after them this much longer,
fill = 26                       # until a low reaches this: then only the mark's one edge shows in the ring
lead = 60                       # Lock opens on this much low run before the chirp, its first frame flat
tick = 1.5                      # the ruler: a tick's width,
spacing = 3                     # about this far apart,
raised = 4                      # the raised ticks' height, on the edges,
lower = 2.3                     # the lower ticks', between them,
line = 50                       # all standing on this line,
clear = 1.5                     # the raised ticks' tops at least this far under the low run,
cut = 28                        # cut inside the ring's outside, so a tick's width never shows past it
fade = [0.18, 0.36]             # the ruler's fade in and out
gap-px = 1.6                    # floors at small sizes, in pixels: the gap between two pulses,
tick-px = 1                     # a tick's width,
spacing-px = 3                  # their spacing,
raised-px = 2.5                 # the raised ticks' height,
lower-px = 1.4                  # the lower ticks'

# Type: Saira's wide cut for display, Hanken Grotesk for text, Martian Mono for figures that change
# in place (wide) and for code (normal width).
[type.display]
family = "Saira"
fallback = ["Hanken Grotesk", "sans-serif"]
stretch = 125
weight = 500
[type.text]
family = "Hanken Grotesk"
fallback = ["Helvetica Neue", "Arial", "sans-serif"]
[type.figures]
family = "Martian Mono"
fallback = ["ui-monospace", "monospace"]
stretch = 112.5
weight = 500
[type.code]
family = "Martian Mono"
fallback = ["ui-monospace", "monospace"]
stretch = 100
weight = 500

# The font files, from google/fonts at a pinned commit, all under the SIL Open Font License 1.1
# with no Reserved Font Name. `web` is the axis range the site keeps (a subset to the characters
# below); `fixed` are the instances verge-gui embeds, egui having no variable axes.
[fonts]
characters = "U+0020-007E, U+00A0-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2010-2027, U+2030-205E, U+2070-209F, U+20AC, U+2122, U+2190-2193, U+2212, U+2264-2265"

[fonts.saira]
family = "Saira"
commit = "8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5"
file = "ofl/saira/Saira[wdth,wght].ttf"
license = "ofl/saira/OFL.txt"
web = { name = "saira-expanded", wdth = [125, 125], wght = [500, 600] }
fixed = [
  { name = "Saira-Expanded-Medium", wdth = 125, wght = 500 },
  { name = "Saira-Expanded-SemiBold", wdth = 125, wght = 600 },
]

[fonts.hanken-grotesk]
family = "Hanken Grotesk"
commit = "c1eda9233c33ad7775b27efd794f931095cf6133"
file = "ofl/hankengrotesk/HankenGrotesk[wght].ttf"
license = "ofl/hankengrotesk/OFL.txt"
web = { name = "hanken-grotesk", wght = [400, 600] }
fixed = [
  { name = "HankenGrotesk-Regular", wght = 400 },
  { name = "HankenGrotesk-Medium", wght = 500 },
  { name = "HankenGrotesk-SemiBold", wght = 600 },
]

[fonts.martian-mono]
family = "Martian Mono"
commit = "c8bba5c4a69195e4fabc69d75136814c65fe0cf5"
file = "ofl/martianmono/MartianMono[wdth,wght].ttf"
license = "ofl/martianmono/OFL.txt"
web = { name = "martian-mono", wdth = [100, 112.5], wght = [500, 500] }
fixed = [
  { name = "MartianMono-Medium", wdth = 100, wght = 500 },
  { name = "MartianMono-SemiExpanded-Medium", wdth = 112.5, wght = 500 },
]

# Icons: a mark from design/marks/ in `ink` on a plate of `ground`, both colour roles at their day
# values. The plate's corners round by `corner` of its side; a 64-unit master sits `inset` of the
# side in from each edge. At a size with a master fitted to the pixel grid (NAME-SIZE.svg), that
# master is drawn instead, at full size.
[icon]
corner = 0.21875
inset = 0.125

# The project's: the dial, ink on lume. The sites' favicon, the iOS icon and the org's avatar.
[icon.project]
mark = "dial"
ground = "lume"
ink = "on-lume"

# Verge's: the V of samples, lume on the plate. verge-gui's app icon on every platform.
[icon.verge]
mark = "verge"
ground = "plate"
ink = "lume"

# tickwave's: a wave on its ticks, lume on the plate. The ticks between the edges' (class "line" in
# the mark) are `line` at `line-opacity`. Its icon files, and its repository's preview.
[icon.tickwave]
mark = "tickwave"
ground = "plate"
ink = "lume"
line = "plate-line"
line-opacity = 0.75
