# Builds the site with the measurements page from mculink-bench's default branch and Verge's docs
# from mculink-verge's and verge's, and publishes it to GitHub Pages. A new measurements page or doc
# publishes on the next run: push here, or run it by hand.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: 0.23.6
      # The release asset's digest, as GitHub's release API reports it.
      ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false
      # The page and the results it is built from, for its check below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Escapement-Project/mculink-bench
          path: mculink-bench
          sparse-checkout: |
            page
            results
          persist-credentials: false
      # The recordings' annotations and charts, which the measurements page cites; the
      # recordings themselves stay on that repository's own site.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Escapement-Project/mculink-recordings
          path: mculink-recordings
          sparse-checkout: |
            /*/*.annotations.toml
            /*/*.jsonl
            /*/*.chart.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Verge's docs, which live beside the code they describe: each repository's Markdown at its
      # root and in docs/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Escapement-Project/mculink-verge
          path: mculink-verge
          sparse-checkout: |
            /*.md
            /docs/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Escapement-Project/verge
          path: verge
          sparse-checkout: |
            /*.md
            /docs/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Nothing publishes stale: the landing's figures must match the results they are written from,
      # the generated files must match their sources (a changed headline changes the link preview),
      # the measurements page's copies of the tokens and of the shared base sheet, header, footer and
      # header scripts must be current, and the page itself must match a fresh build of its results
      # and copies, every annotation its wire section cites present in the recordings.
      - name: Check
        run: |
          python3 mculink-bench/page/extract.py --landing site/data/landing.json --check
          cd site && uv run design/build.py --check ../mculink-bench/page/tokens.css \
            ../mculink-bench/page/out/fonts/* ../mculink-bench/page/dial.svg ../mculink-bench/page/favicon.ico \
            ../mculink-bench/page/base.css ../mculink-bench/page/header.html ../mculink-bench/page/footer.html \
            ../mculink-bench/page/face.js ../mculink-bench/page/header.js
          cd .. && python3 mculink-bench/page/build.py --check
      - name: Install Zola
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/zola-v$ZOLA_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZOLA_SHA256  $RUNNER_TEMP/zola.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP"
      - name: Build
        run: |
          python3 site/.github/measurements.py mculink-bench/page/out site
          python3 site/.github/verge-docs.py site
          cd site && "$RUNNER_TEMP/zola" build
          python3 .github/search-index.py public
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
